<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Feriha — XAUUSD News Terminal</title>
</head>
<body>
<!-- PLACEHOLDER: signal logic patch intentionally isolated; original UI must be preserved before merge. -->
<script>
function num(v){const n=parseFloat(String(v??'').replace(/[^-\d.]/g,''));return Number.isFinite(n)?n:null}
function analyze(e){
  const name=String(e.Event||'').toLowerCase();
  const actual=num(e.Actual), forecast=num(e.Forecast);
  if(actual===null||forecast===null)return{dir:'wait',score:0,reason:'Actual और Forecast उपलब्ध होने तक directional signal नहीं बनाना चाहिए.'};
  const surprise=actual-forecast;
  const bearishWhenHigher=/cpi|inflation|pce|payroll|nfp|employment|pmi|ism|gdp|retail sales|consumer confidence|fed funds|interest rate|rate decision|jolts|durable goods/.test(name);
  const bullishWhenHigher=/unemployment|jobless claims|initial claims|continuing claims/.test(name);
  if(!bearishWhenHigher&&!bullishWhenHigher)return{dir:'wait',score:0,reason:'इस event के लिए predefined gold-impact mapping नहीं है.'};
  const threshold=Math.max(Math.abs(forecast)*0.005,0.01);
  if(Math.abs(surprise)<threshold)return{dir:'wait',score:45,reason:`Actual ${actual} और Forecast ${forecast} में meaningful surprise नहीं है.`};
  const goldBullish=bullishWhenHigher?surprise>0:surprise<0;
  const score=Math.min(95,Math.round(55+Math.min(40,Math.abs(surprise)/threshold*10)));
  return{dir:goldBullish?'long':'short',score,reason:`Actual ${actual} vs Forecast ${forecast}; gold bias ${goldBullish?'bullish':'bearish'} based on the event mapping.`};
}
</script>
</body>
</html>
